function leerOrigenSeleccionado(prefixId, plataforma) {
var tipo = MAPA_ORIGEN_PLATAFORMA[plataforma];
if (!tipo) return null;
if (tipo === 'empresa') {
var elE = document.getElementById(prefixId + 'SelEmpresa');
if (elE && elE.value) {
var e = empresas.find(function(x){ return String(x.id) === elE.value; });
if (e) return { tipo: 'empresa', id: e.id, nombre: e.nombreComercial };
}
} else if (tipo === 'hotel') {
var elH = document.getElementById(prefixId + 'SelHotel');
if (elH && elH.value) {
var h = hoteles.find(function(x){ return String(x.id) === elH.value; });
if (h) return { tipo: 'hotel', id: h.id, nombre: h.nombre };
}
} else if (tipo === 'cliente') {
var elC = document.getElementById(prefixId + 'SelCliente');
if (elC && elC.value) {
var c = clientes.find(function(x){ return String(x.id) === elC.value; });
if (c) return { tipo: 'cliente', id: c.id, nombre: c.nombre };
}
}
return null;
}

function autoguardarOrigenIngreso(id, tipo, valorId) {
var i = ingresos.find(function(x){ return x.id === id; });
if (!i) return;
if (!valorId) {
i.origenTipo = null; i.origenId = null; i.origenNombre = null;
} else if (tipo === 'empresa') {
var e = empresas.find(function(x){ return String(x.id) === String(valorId); });
i.origenTipo = 'empresa'; i.origenId = valorId; i.origenNombre = e ? e.nombreComercial : '';
} else if (tipo === 'hotel') {
var h = hoteles.find(function(x){ return String(x.id) === String(valorId); });
i.origenTipo = 'hotel'; i.origenId = valorId; i.origenNombre = h ? h.nombre : '';
} else if (tipo === 'cliente') {
var c = clientes.find(function(x){ return String(x.id) === String(valorId); });
i.origenTipo = 'cliente'; i.origenId = valorId; i.origenNombre = c ? c.nombre : '';
}
try { localStorage.setItem('cotizador_ingresos', JSON.stringify(ingresos)); } catch(e) {}
mostrarIndicadorGuardadoIngreso(id);
}

// ============================================================
// CONTROL DE COBRO WELCOMEAPP (Fase 6) — WelcomeApp paga el
// primer miércoles del mes SIGUIENTE al mes del servicio (mes
// vencido, igual criterio que Canon BIP). La fecha de pago se
// calcula dinámicamente a partir de la fecha del ingreso; no se
// guarda como texto fijo, para que siempre quede correcta si la
// fecha del ingreso se edita. Solo aplica a plataforma
// 'WelcomeApp'; el resto de orígenes no se ve afectado.
// ============================================================

function primerMiercolesDelMes(anio, mesIndex) {
var d = new Date(anio, mesIndex, 1);
var dow = d.getDay();
var offset = (3 - dow + 7) % 7;
d.setDate(1 + offset);
return d;
}

function fechaPagoWelcomeApp(fechaLocalDDMMYYYY) {
var partes = fechaLocalDDMMYYYY.split('/');
var mes = parseInt(partes[1], 10) - 1;
var anio = parseInt(partes[2], 10);
var mesSiguiente = mes + 1;
var anioSiguiente = anio;
if (mesSiguiente > 11) { mesSiguiente = 0; anioSiguiente = anio + 1; }
var d = primerMiercolesDelMes(anioSiguiente, mesSiguiente);
var dd = ('0' + d.getDate()).slice(-2);
var mm = ('0' + (d.getMonth()+1)).slice(-2);
return dd + '/' + mm + '/' + d.getFullYear();
}

// ============================================================
// BIP TRANSPORTES — INTEGRACIÓN CON INGRESOS (Fase 7, corregida
// en Fase 9). BIP Transportes ya NO es una plataforma: es una
// empresa dentro del directorio de Empresas. Un ingreso queda
// identificado como "de BIP" cuando su plataforma es 'Empresa'
// y la empresa elegida es, precisamente, BIP Transportes.
//
// esIngresoBIPTransportes() reconoce AMBOS casos para no perder
// ni duplicar información: los registros nuevos (plataforma
// 'Empresa' + origenNombre 'BIP Transportes') y los registros
// antiguos guardados antes de esta corrección (plataforma
// literal 'BIP Transportes', antes de que existiera este
// directorio). No se migra ni se reescribe ningún dato viejo.
//
// obtenerIngresosBIPPorPeriodo() y agruparIngresosBIPPorPeriodo()
// siguen siendo solo informativas — el valor compensado del
// canon se sigue ingresando manualmente, sin cambios.
// ============================================================

function idEmpresaBIPTransportes() {
var e = empresas.find(function(x){ return x.nombreComercial === 'BIP Transportes'; });
return e ? e.id : null;
}

function esIngresoBIPTransportes(i) {
if (i.plataforma === 'BIP Transportes') return true; // compatibilidad con registros previos a la Fase 9
if (i.plataforma === 'Empresa' && i.origenNombre === 'BIP Transportes') return true;
return false;
}

function periodoIngresoBIP(fechaLocalDDMMYYYY) {
var partes = fechaLocalDDMMYYYY.split('/');
return { mesIdx: parseInt(partes[1], 10) - 1, anio: parseInt(partes[2], 10) };
}

function obtenerIngresosBIPPorPeriodo(mesIdx, anio) {
var filtrados = ingresos.filter(function(i){
if (!esIngresoBIPTransportes(i)) return false;
var p = periodoIngresoBIP(i.fecha);
return p.mesIdx === mesIdx && p.anio === anio;
});
var total = filtrados.reduce(function(acc, i){ return acc + (i.monto || 0); }, 0);
return { ingresos: filtrados, total: total };
}

// agruparIngresosBIPPorPeriodo() recorre `ingresos` UNA sola vez y agrupa
// por mes/año — no crea ni duplica registros, solo lee y resume los ya
// existentes. Se usa exclusivamente para mostrar el acumulado informativo
// en Finanzas (renderAcumuladoBIP); Canon BIP sigue calculando el canon
// exactamente igual que antes, sin depender de esto todavía.
function agruparIngresosBIPPorPeriodo() {
var mapa = {};
ingresos.forEach(function(i){
if (!esIngresoBIPTransportes(i)) return;
var p = periodoIngresoBIP(i.fecha);
var key = p.anio + '-' + p.mesIdx;
if (!mapa[key]) mapa[key] = { mesIdx: p.mesIdx, anio: p.anio, total: 0, cantidad: 0 };
mapa[key].total += (i.monto || 0);
mapa[key].cantidad += 1;
});
var lista = Object.keys(mapa).map(function(k){ return mapa[k]; });
lista.sort(function(a,b){ if (a.anio !== b.anio) return b.anio - a.anio; return b.mesIdx - a.mesIdx; });
return lista;
}

function renderAcumuladoBIP() {
var periodos = agruparIngresosBIPPorPeriodo();
var html = '<div class="card"><h2>🏢 BIP Transportes — Acumulado por período</h2>';
html += '<p class="hint">Vista informativa preparada para que Canon BIP la use en una fase posterior. No modifica el cálculo actual del canon.</p>';
if (periodos.length === 0) {
html += '<div class="empty-state"><div class="empty-state-text">Aún no hay ingresos registrados de BIP Transportes</div></div>';
} else {
html += '<div class="hist-list">';
periodos.forEach(function(p){
var nombreMes = mesNombre(p.mesIdx).charAt(0) + mesNombre(p.mesIdx).slice(1).toLowerCase();
html += '<div class="hist-item" style="cursor:default"><div class="hist-route">📆 ' + nombreMes + ' ' + p.anio + '</div><div class="hist-details"><span>' + p.cantidad + ' ingreso' + (p.cantidad===1?'':'s') + '</span><span class="hist-price" style="color:#059669">' + formatCOP(p.total) + '</span></div></div>';
});
html += '</div>';
}
html += '</div>';
return html;
}

// nombreEmpresaVinculada() (Fase 12) — nunca hardcodea "BIP Transportes":
// toma el nombre de la empresa vinculada dinámicamente desde BIP_CFG.empresa
// (ya configurable en "Config BIP"), que es el dato que hoy representa la
// empresa bajo la cual opera el usuario. Si en el futuro otro usuario no
// tiene empresa vinculada (vehículo propio) o cambia de empresa, esta
// función sigue funcionando sin cambios de código.
function nombreEmpresaVinculada() {
return (BIP_CFG && BIP_CFG.empresa) ? BIP_CFG.empresa : 'Empresa vinculada';
}

function etiquetaResponsableCosto(valor) {
if (valor === 'empresa_vinculada') return '🏢 ' + nombreEmpresaVinculada();
if (valor === 'otro') return '🔹 Otro';
return '👤 Usuario';
}

function sumarMeses(fechaISO, meses) {
var d = new Date(fechaISO + 'T00:00:00');
d.setMonth(d.getMonth() + meses);
return d;
}

function calcularEstadoMantenimiento(item) {
var estados = [];
var tieneUltimoKm = (item.ultimoKm !== undefined && item.ultimoKm !== null && item.ultimoKm !== '');
if ((item.tipo === 'km' || item.tipo === 'ambos') && item.intervaloKm && tieneUltimoKm) {
var proximoKm = item.ultimoKm + item.intervaloKm;
var faltanKm = proximoKm - MANTENIMIENTO_CFG.odometroActual;
var nivelKm = faltanKm <= 0 ? 'vencido' : faltanKm <= 100 ? 'urgente' : faltanKm <= 500 ? 'pronto' : faltanKm <= 1000 ? 'aviso' : 'ok';
estados.push({tipo:'km', proximo: proximoKm, restante: faltanKm, nivel: nivelKm, texto: (faltanKm<=0 ? 'Vencido hace ' + formatNum(-faltanKm) + ' km' : 'Faltan ' + formatNum(faltanKm) + ' km') + ' (próximo: ' + formatNum(proximoKm) + ' km)'});
}
if ((item.tipo === 'fecha' || item.tipo === 'ambos') && item.intervaloMeses && item.ultimaFecha) {
var proximaFecha = sumarMeses(item.ultimaFecha, item.intervaloMeses);
var diasRestantes = Math.round((proximaFecha - new Date()) / (1000*60*60*24));
var nivelF = diasRestantes <= 0 ? 'vencido' : diasRestantes <= 7 ? 'urgente' : diasRestantes <= 30 ? 'pronto' : diasRestantes <= 60 ? 'aviso' : 'ok';
estados.push({tipo:'fecha', proximo: proximaFecha.toLocaleDateString('es-CO'), restante: diasRestantes, nivel: nivelF, texto: (diasRestantes<=0 ? 'Vencido hace ' + (-diasRestantes) + ' días' : 'Faltan ' + diasRestantes + ' días') + ' (vence: ' + proximaFecha.toLocaleDateString('es-CO') + ')'});
}
if (estados.length === 0) return {nivel:'sin_datos', texto:'Sin registro inicial — configura abajo'};
var peor = estados.sort(function(a,b){ var orden={vencido:0,urgente:1,pronto:2,aviso:3,ok:4}; return orden[a.nivel]-orden[b.nivel]; })[0];
return {nivel: peor.nivel, texto: estados.map(function(e){return e.texto;}).join(' · ')};
}

function colorNivel(nivel) {
if (nivel==='vencido') return '#dc2626';
if (nivel==='urgente') return '#ea580c';
if (nivel==='pronto') return '#d97706';
if (nivel==='aviso') return '#ca8a04';
if (nivel==='sin_datos') return 'var(--text-mute)';
return '#059669';
}

function guardarOdometro() {
var val = parseFloat(document.getElementById('odometroActual').value);
if (isNaN(val) || val < 0) return;
if (val < MANTENIMIENTO_CFG.odometroActual) {
if (!confirm('El nuevo valor (' + formatNum(val) + ' km) es menor al odómetro guardado (' + formatNum(MANTENIMIENTO_CFG.odometroActual) + ' km). ¿Confirmas que quieres bajarlo?')) return;
}
MANTENIMIENTO_CFG.odometroActual = val;
guardarMantenimientoCfg();
document.getElementById('odometroMsg').innerHTML = '<div class="alert alert-success">✅ Odómetro actualizado</div>';
renderApp();
}

function guardarItemMantenimiento(id) {
var item = MANTENIMIENTO_CFG.items.find(function(it){ return it.id===id; });
if (!item) return;
if (item.tipo==='km' || item.tipo==='ambos') {
item.intervaloKm = parseFloat(document.getElementById('int_km_'+id).value) || item.intervaloKm;
var ultKmStr = document.getElementById('ult_km_'+id).value;
if (ultKmStr !== '') {
var ultKmVal = parseFloat(ultKmStr);
if (!isNaN(ultKmVal)) item.ultimoKm = ultKmVal;
}
// Si el campo queda vacío, se conserva item.ultimoKm tal como estaba (nunca se fuerza a 0).
}
if (item.tipo==='fecha' || item.tipo==='ambos') {
item.intervaloMeses = parseFloat(document.getElementById('int_mes_'+id).value) || item.intervaloMeses;
item.ultimaFecha = document.getElementById('ult_fecha_'+id).value || item.ultimaFecha;
}
guardarMantenimientoCfg();
renderApp();
}

function guardarMantenimientoCfg() {
try { localStorage.setItem('cotizador_mantenimiento_cfg', JSON.stringify(MANTENIMIENTO_CFG)); } catch(e) {}
}

function registrarMantenimientoRealizado() {
var itemId = document.getElementById('regItemId').value;
var fecha = document.getElementById('regFecha').value;
var km = parseFloat(document.getElementById('regKm').value) || 0;
var costo = parseFloat(document.getElementById('regCosto').value) || 0;
var responsable = document.getElementById('regResponsable').value;
var proveedor = document.getElementById('regProveedor').value;
var obs = document.getElementById('regObs').value;
var factura = document.getElementById('regFactura').value;

var item = MANTENIMIENTO_CFG.items.find(function(it){ return it.id===itemId; });
var registro = {itemId: itemId, fecha: fechaISOaLocal(fecha), km: km, costo: costo, responsable: responsable, proveedor: proveedor, observaciones: obs, factura: factura, id: Date.now(), gastoId: null};

// También registrar como gasto en el módulo financiero, solo cuando el
// responsable del costo es 'usuario' (Empresa vinculada u Otro quedan como
// control interno, sin generar gasto). Se guarda el id del gasto vinculado
// (gastoId) para poder mantenerlo sincronizado si luego se edita o elimina.
if (costo > 0 && responsable === 'usuario') {
var gastoId = Date.now() + 1;
gastos.push({categoria:'Mantenimiento', monto: costo, fecha: fechaISOaLocal(fecha), nota: (item?item.nombre:itemId) + (proveedor?' - '+proveedor:''), id: gastoId});
try { localStorage.setItem('cotizador_gastos', JSON.stringify(gastos)); } catch(e) {}
registro.gastoId = gastoId;
}

historialMantenimiento.push(registro);
try { localStorage.setItem('cotizador_mantenimiento_historial', JSON.stringify(historialMantenimiento)); } catch(e) {}

if (item) {
if (item.tipo==='km' || item.tipo==='ambos') item.ultimoKm = km;
if (item.tipo==='fecha' || item.tipo==='ambos') item.ultimaFecha = fecha;
}
if (km > MANTENIMIENTO_CFG.odometroActual) MANTENIMIENTO_CFG.odometroActual = km;
guardarMantenimientoCfg();

renderApp();
}

// ============================================================
// DOCUMENTOS DE MANTENIMIENTO (Fase 11) — archivos adjuntos
// asociados a un ítem del catálogo (SOAT, tecnomecánica, tarjeta
// de propiedad, pólizas, o cualquier otro ítem) o a un registro
// específico del historial (factura/soporte/comprobante). Se
// guardan en localStorage.cotizador_mantenimiento_documentos y
// persisten al cerrar/abrir la PWA. No modifica Finanzas, BIP,
// Cuentas de Cobro, Empresas ni Cotizador.
// ============================================================

function renderDocumentosMantenimiento(tipo, refId) {
var docs = documentosMantenimiento.filter(function(d){ return d.tipo === tipo && String(d.refId) === String(refId); });
var html = '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)">';
html += '<div class="hint" style="margin-bottom:4px">📎 Documentos' + (docs.length ? ' (' + docs.length + ')' : '') + '</div>';
docs.forEach(function(d){
html += '<div class="cost-row" style="font-size:12px"><span onclick="verDocumentoMantenimiento(' + d.id + ')" style="cursor:pointer;text-decoration:underline;color:#2563eb">📄 ' + d.nombreArchivo + '</span><button type="button" class="btn-secondary" style="padding:2px 8px;font-size:11px;color:#dc2626;border-color:#dc2626" onclick="eliminarDocumentoMantenimiento(' + d.id + ')">🗑️</button></div>';
});
html += '<input type="file" class="input" style="margin-top:6px;font-size:12px;padding:6px" onchange="cargarDocumentoMantenimiento(this, \'' + tipo + '\', \'' + refId + '\')">';
html += '</div>';
return html;
}

function cargarDocumentoMantenimiento(input, tipo, refId) {
var file = input.files && input.files[0];
if (!file) return;
var reader = new FileReader();
reader.onload = function(e) {
var doc = {
id: Date.now(),
tipo: tipo,
refId: refId,
nombreArchivo: file.name,
mimeType: file.type || 'application/octet-stream',
dataUrl: e.target.result,
tamanoKB: Math.round(file.size / 1024),
fecha: fechaISOaLocal(fechaLocalHoyISO())
};
documentosMantenimiento.push(doc);
try {
localStorage.setItem('cotizador_mantenimiento_documentos', JSON.stringify(documentosMantenimiento));
} catch (err) {
console.error('No se pudo guardar el documento (probablemente muy grande):', err);
documentosMantenimiento.pop();
alert('El archivo es demasiado grande para guardarse en el dispositivo. Intenta con un archivo más liviano (por ejemplo, una foto con menor resolución).');
return;
}
renderApp();
};
reader.readAsDataURL(file);
}

function eliminarDocumentoMantenimiento(docId) {
if (!confirm('¿Eliminar este documento permanentemente? Esta acción no se puede deshacer.')) return;
documentosMantenimiento = documentosMantenimiento.filter(function(d){ return d.id !== docId; });
try { localStorage.setItem('cotizador_mantenimiento_documentos', JSON.stringify(documentosMantenimiento)); } catch(e) {}
renderApp();
}

function verDocumentoMantenimiento(docId) {
var doc = documentosMantenimiento.find(function(d){ return d.id === docId; });
if (!doc) return;
try {
var partes = doc.dataUrl.split(',');
var base64 = partes[1];
var bytes = base64ToUint8Array(base64);
var blob = new Blob([bytes], {type: doc.mimeType || 'application/octet-stream'});
var url = URL.createObjectURL(blob);
var a = document.createElement('a');
a.href = url;
a.download = doc.nombreArchivo || 'documento';
a.target = '_blank';
a.rel = 'noopener';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
} catch (err) {
console.error('Error al abrir el documento:', err);
alert('No se pudo abrir el documento. Intenta adjuntarlo de nuevo.');
}
}

// ============================================================
// EDITAR / ELIMINAR HISTORIAL DE MANTENIMIENTO (Fase 11-12) —
// mismo patrón ya usado en Ingresos/Gastos: el formulario de
// edición se precarga con los datos existentes y solo se
// sobrescriben al presionar "Guardar cambios"; "Cancelar"
// descarta sin modificar nada. El gasto vinculado en Finanzas
// (registro.gastoId) se mantiene sincronizado: se actualiza si
// el costo cambia, se crea si antes no existía, y se elimina si
// el costo queda en 0 o si se borra el registro completo.
// ============================================================

function guardarEdicionHistMantenimiento(id) {
var idx = historialMantenimiento.findIndex(function(h){ return h.id === id; });
if (idx === -1) return;
var anterior = historialMantenimiento[idx];
var fechaISO = document.getElementById('histEditFecha_' + id).value;
var km = parseFloat(document.getElementById('histEditKm_' + id).value) || 0;
var costo = parseFloat(document.getElementById('histEditCosto_' + id).value) || 0;
var responsable = document.getElementById('histEditResponsable_' + id).value;
var itemId = document.getElementById('histEditItem_' + id).value;
var proveedor = document.getElementById('histEditProveedor_' + id).value;
var fechaLocal = fechaISOaLocal(fechaISO);
var item = MANTENIMIENTO_CFG.items.find(function(it){ return it.id === itemId; });

// Mantener sincronizado el gasto vinculado en Finanzas: solo debe existir
// cuando el responsable del costo es 'usuario' y hay costo (> 0). Si el
// responsable es 'empresa_vinculada' u 'otro', el costo queda como control
// interno y NO genera ni mantiene gasto — se elimina el vinculado si existía.
var debeGenerarGasto = (responsable === 'usuario' && costo > 0);
var gastoIdVinculado = anterior.gastoId || null;
if (gastoIdVinculado) {
var idxGasto = gastos.findIndex(function(g){ return g.id === gastoIdVinculado; });
if (debeGenerarGasto) {
if (idxGasto !== -1) {
gastos[idxGasto].monto = costo;
gastos[idxGasto].fecha = fechaLocal;
gastos[idxGasto].nota = (item?item.nombre:itemId) + (proveedor?' - '+proveedor:'');
} else {
gastoIdVinculado = Date.now() + 1;
gastos.push({categoria:'Mantenimiento', monto: costo, fecha: fechaLocal, nota: (item?item.nombre:itemId) + (proveedor?' - '+proveedor:''), id: gastoIdVinculado});
}
} else {
if (idxGasto !== -1) gastos.splice(idxGasto, 1);
gastoIdVinculado = null;
}
try { localStorage.setItem('cotizador_gastos', JSON.stringify(gastos)); } catch(e) {}
} else if (debeGenerarGasto) {
gastoIdVinculado = Date.now() + 1;
gastos.push({categoria:'Mantenimiento', monto: costo, fecha: fechaLocal, nota: (item?item.nombre:itemId) + (proveedor?' - '+proveedor:''), id: gastoIdVinculado});
try { localStorage.setItem('cotizador_gastos', JSON.stringify(gastos)); } catch(e) {}
}

historialMantenimiento[idx] = {
id: id,
itemId: itemId,
fecha: fechaLocal,
km: km,
costo: costo,
responsable: responsable,
proveedor: proveedor,
observaciones: document.getElementById('histEditObs_' + id).value,
factura: document.getElementById('histEditFactura_' + id).value,
gastoId: gastoIdVinculado
};
try { localStorage.setItem('cotizador_mantenimiento_historial', JSON.stringify(historialMantenimiento)); } catch(e) {}
window.__editandoHistMantId = null;
renderApp();
}

function eliminarHistMantenimientoUI(id) {
var registro = historialMantenimiento.find(function(h){ return h.id === id; });
var tieneGasto = !!(registro && registro.gastoId);
var mensaje = tieneGasto
? '¿Eliminar este registro de mantenimiento permanentemente? También se eliminará el gasto vinculado en Finanzas. Esta acción no se puede deshacer.'
: '¿Eliminar este registro de mantenimiento permanentemente? Esta acción no se puede deshacer.';
if (!confirm(mensaje)) return;
if (tieneGasto) {
gastos = gastos.filter(function(g){ return g.id !== registro.gastoId; });
try { localStorage.setItem('cotizador_gastos', JSON.stringify(gastos)); } catch(e) {}
}
historialMantenimiento = historialMantenimiento.filter(function(h){ return h.id !== id; });
try { localStorage.setItem('cotizador_mantenimiento_historial', JSON.stringify(historialMantenimiento)); } catch(e) {}
if (window.__editandoHistMantId === id) window.__editandoHistMantId = null;
renderApp();
}

function opcionesTipoLugar(seleccionado) {
var tipos = [
{v:'ciudad', l:'Ciudad/Municipio'}, {v:'aeropuerto', l:'Aeropuerto'}, {v:'hotel', l:'Hotel'},
{v:'clinica', l:'Clínica'}, {v:'empresa', l:'Empresa'}, {v:'centro_comercial', l:'Centro comercial'},
{v:'terminal', l:'Terminal'}, {v:'turistico', l:'Sitio turístico'}, {v:'otro', l:'Otro'}
];
return tipos.map(function(t){ return '<option value="'+t.v+'"'+(t.v===seleccionado?' selected':'')+'>'+t.l+'</option>'; }).join('');
}

function iconoTipoLugar(tipo) {
var iconos = {ciudad:'🏙️', municipio:'🏘️', aeropuerto:'✈️', hotel:'🏨', clinica:'🏥', empresa:'🏢', centro_comercial:'🛍️', terminal:'🚌', turistico:'📍', otro:'📌'};
return iconos[tipo] || '📍';
}

function base64ToUint8Array(base64) {
var binary = atob(base64);
var bytes = new Uint8Array(binary.length);
for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
return bytes;
}

function uint8ArrayToBase64(bytes) {
var binary = '';
var chunk = 0x8000;
for (var i = 0; i < bytes.length; i += chunk) {
binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
}
return btoa(binary);
}

if (!valor || valor <= 0) { alert('Ingresa un valor válido (mayor a 0) antes de generar la Cuenta de Cobro.'); return; }

observaciones: observaciones
};
cuentasCobro.push(datos);
try { localStorage.setItem('cotizador_cuentas_cobro', JSON.stringify(cuentasCobro)); } catch(e) {}
window.__cuentaCobroActual = datos;
renderApp();
// Descarga inmediata del PDF (además de quedar disponible en el historial de abajo)
try {
var pdf = construirPDFCuentaCobro(datos);
var blob = pdf.output('blob');
var url = URL.createObjectURL(blob);

a.href = url; a.download = nombreArch;
document.body.appendChild(a); a.click(); document.body.removeChild(a);
setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
} catch (err) {
console.error('Error generando el PDF de la Cuenta de Cobro:', err);
alert('La Cuenta de Cobro quedó guardada, pero hubo un error generando el PDF: ' + (err && err.message ? err.message : 'error desconocido') + '. Puedes intentar de nuevo con el botón "💾 Guardar PDF" de abajo.');
}
}

// La posición se expresa en PORCENTAJE de la página (no en mm fijos) para
// que funcione igual sin importar si el PDF que envía BIP es tamaño Carta
// o A4. xPct = % desde el borde izquierdo donde queda el CENTRO de la
// firma; yPct = % desde el borde SUPERIOR donde queda el borde INFERIOR
// de la firma (justo encima del texto "Firma propietario"). Los valores
// por defecto se calibraron visualmente sobre el formato real de BIP
// (CTA_CBRO_BQ-032-2026): el recuadro "Firma propietario" queda a la
// derecha de "BANCO:", cerca del 66% del alto de la página.
function leerPosicionFirmaBip() {
var elX = document.getElementById('bipFirmaX');
var elY = document.getElementById('bipFirmaY');
var xPct = elX ? parseFloat(elX.value) : bipFirmaPos.xPct;
var yPct = elY ? parseFloat(elY.value) : bipFirmaPos.yPct;
if (isNaN(xPct)) xPct = bipFirmaPos.xPct;
if (isNaN(yPct)) yPct = bipFirmaPos.yPct;
return { xPct: xPct, yPct: yPct };
}

// estamparFirmaBip() es exclusivo del flujo BIP: coloca ÚNICAMENTE la firma
// digital existente en la posición (xPct,yPct) indicada, sobre la última
// página del PDF adjuntado, sin tocar ningún otro contenido. Esta posición
// es independiente y nunca usa la posición estándar de las Cuentas de
// Cobro de Solar VIP (construirPDFCuentaCobro).
async function estamparFirmaBip(bytesOriginal, xPct, yPct) {
var pdfDoc = await PDFLib.PDFDocument.load(bytesOriginal);
var pngBytes = base64ToUint8Array(window.FIRMA_DIGITAL_B64);
var pngImage = await pdfDoc.embedPng(pngBytes);
var anchoFirma = 130;
var dims = pngImage.scale(anchoFirma / pngImage.width);
var paginas = pdfDoc.getPages();
var ultima = paginas[paginas.length - 1];
var tam = ultima.getSize();
var xImg = (xPct / 100) * tam.width - dims.width / 2;
var yImg = tam.height * (1 - yPct / 100); // borde inferior de la firma, medido desde arriba
ultima.drawImage(pngImage, { x: xImg, y: yImg, width: dims.width, height: dims.height });
return await pdfDoc.save();
}

async function firmarPDFBip() {
if (!window.__bipPdfOriginalBytes) return;
if (typeof window.PDFLib === 'undefined') { alert('No se pudo cargar el motor de firma de PDF. Verifica tu conexión e inténtalo de nuevo.'); return; }
var pos = leerPosicionFirmaBip();
try {
var signedBytes = await estamparFirmaBip(window.__bipPdfOriginalBytes, pos.xPct, pos.yPct);
window.__bipPdfFirmadoBytes = signedBytes;
window.__bipPdfPreviewBytes = null;
bipFirmaPos = pos;
try { localStorage.setItem('cotizador_bip_firma_pos', JSON.stringify(bipFirmaPos)); } catch(e) {}

var registro = { id: Date.now(), fecha: fechaISOaLocal(fechaLocalHoyISO()), nombreArchivo: window.__bipPdfNombreArchivo || 'documento.pdf', tamanoKB: Math.round(signedBytes.length / 1024) };
try {
registro.pdfOriginalB64 = uint8ArrayToBase64(window.__bipPdfOriginalBytes);
registro.pdfFirmadoB64 = uint8ArrayToBase64(signedBytes);
documentosBIP.push(registro);
localStorage.setItem('cotizador_bip_documentos', JSON.stringify(documentosBIP));
} catch (storageErr) {
console.error('No se pudo guardar el PDF completo en el historial local (probablemente muy grande):', storageErr);
documentosBIP.push({ id: registro.id, fecha: registro.fecha, nombreArchivo: registro.nombreArchivo, tamanoKB: registro.tamanoKB, noAlmacenado: true });
try { localStorage.setItem('cotizador_bip_documentos', JSON.stringify(documentosBIP)); } catch(e2) {}
}
renderApp();
} catch (err) {
console.error('Error firmando PDF de BIP:', err);
alert('No se pudo firmar el documento: ' + (err && err.message ? err.message : 'error desconocido'));
}
}
