.switch { position: relative; width: 46px; height: 26px; }

.result-header h3 { font-size: 15px; color: var(--text); }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
.stat { background: var(--card-bg); padding: 14px 10px; text-align: center; }

.stat-value { font-size: 15px; font-weight: 700; color: var(--text); }
